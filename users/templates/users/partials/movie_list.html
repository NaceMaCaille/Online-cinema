<style>
.movie-card {
  background: #1e293b;
  padding: 10px;
  border-radius: 12px;
  text-align: center;
}

.movie-card img {
  width: 100%;
  border-radius: 8px;
}

.movie-card h3 {
  font-size: 14px;
  margin: 10px 0 5px;
}

.movie-card span {
  font-size: 12px;
  color: #38bdf8;
}
</style>

{% for movie in movies %}
  <div class="movie-card" style="max-width: 250px">
      {% if movie.poster_path %}
          <a href="{% url "movie:movie_detail" movie.id %}"><img src="https://image.tmdb.org/t/p/w500{{ movie.poster_path }}" alt="{{ movie.title }}"></a>
      {% endif %}
      <h3>{{ movie.title }}</h3>
  </div>
{% endfor %}
