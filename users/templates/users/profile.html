<style>

* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #0f172a;
  color: #fff;
}

.profile {
  max-width: 900px;
  margin: 40px auto;
  padding: 20px;
}

.profile-header {
  text-align: center;
  margin-bottom: 30px;
}

.profile-header img {
  border-radius: 60%;
  margin-bottom: 10px;
}

.profile-header h1 {
  margin: 5px 0;
}

.profile-header p {
  color: #94a3b8;
}

.tabs {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 30px;
}

.tabs button {
  background: #1e293b;
  color: #fff;
  border: none;
  padding: 10px 18px;
  border-radius: 20px;
  cursor: pointer;
}

.tabs .active {
  background: #38bdf8;
  color: #020617;
}

.movies {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 20px;
}

.movie-card {
  background: #1e293b;
  padding: 10px;
  border-radius: 12px;
  text-align: center;
}

.movie-card img {
  width: 100%;
  border-radius: 8px;
}

.movie-card h3 {
  font-size: 14px;
  margin: 10px 0 5px;
}

.movie-card span {
  font-size: 12px;
  color: #38bdf8;
}
</style>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Профиль пользователя</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="profile">
  <div class="profile-header">
    <img src="{{user.image.url}}" alt="Аватар" style="max-width: 110px">
    <h1>{{request.user.username}}</h1>
    <p>Люблю хорошие фильмы 🎬</p>
  </div>

  <div class="tabs">
    <button class="active">Избранное</button>
    <button>В планах</button>
    <button>Просмотрено</button>
  </div>
<div class="tabs">
  <button class="active">Избранное</button>
</div>
<div class="movies">
  
{% for movie in favorites %}
  <div class="movie-card" style="max-width: 250px">
      {% if movie.poster_path %}
          <a href="{% url "movie:movie_detail" movie.id %}"><img src="https://image.tmdb.org/t/p/w500{{ movie.poster_path }}" alt="{{ movie.title }}"></a>
      {% endif %}
      <h3>{{ movie.title }}</h3>
  </div>
{% endfor %}
</div>

</div>

</body>
</html>
