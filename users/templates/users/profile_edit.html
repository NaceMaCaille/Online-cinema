
<style>
.profile-container {
  max-width: 600px;
  margin: 40px auto;
  background: #0f172a;
  padding: 30px;
  border-radius: 16px;
  color: #e5e7eb;
}

.profile-title {
  text-align: center;
  margin-bottom: 30px;
}

.profile-form {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* Аватар */
.avatar-block {
  text-align: center;
}

.avatar {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  object-fit: cover;
  margin-bottom: 10px;
}

.avatar.placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #1e293b;
  font-size: 48px;
}

.file-label {
  display: inline-block;
  cursor: pointer;
  font-size: 14px;
  color: #38bdf8;
}

.file-label input {
  display: none;
}

/* Поля */
.form-group {
  display: flex;
  flex-direction: column;
}

.form-group label {
  margin-bottom: 6px;
  font-size: 14px;
}

.form-group input {
    padding: 10px;
  border-radius: 8px;
  border: none;
  background: #1e293b;
  color: #fff;
}

/* Кнопки */
.form-actions {
  display: flex;
  gap: 12px;
  justify-content: flex-end;
  margin-top: 20px;
}

.btn-primary {
    padding: 10px 20px;
  background: #38bdf8;
  color: #0f172a;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.btn-secondary {
  padding: 10px 20px;
  background: transparent;
  border: 1px solid #38bdf8;
  color: #38bdf8;
  border-radius: 8px;
  text-decoration: none;
}

.btn-primary:hover {
  opacity: 0.9;
}
</style>

<div class="profile-container">

  <h1 class="profile-title">Редактирование профиля</h1>

  <form method="post" enctype="multipart/form-data" class="profile-form">
    {% csrf_token %}

    <!-- Аватар -->
    <div class="avatar-block">
      {% if user.image %}
        <img src="{{ user.image.url }}" alt="Аватар" class="avatar">
      {% else %}
        <div class="avatar placeholder">👤</div>
      {% endif %}

      <label class="file-label">
        Изменить аватар
        {{ form.image }}
      </label>
    </div>

    <!-- Основные данные -->
    <div class="form-group">
      <label>Имя пользователя</label>
      {{ form.username }}
    </div>

    <div class="form-group">
      <label>Email</label>
      {{ form.email }}
    </div>

    <div class="form-group">
      <label>Имя</label>
      {{ form.first_name }}
    </div>

    <div class="form-group">
      <label>Фамилия</label>
      {{ form.last_name }}
    </div>

    <!-- Кнопки -->
    <div class="form-actions">
      <button type="submit" class="btn-primary">Сохранить</button>
      <a href="{% url 'user:profile' %}" class="btn-secondary">Отмена</a>
    </div>

  </form>
</div>
